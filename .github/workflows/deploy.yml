name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-branch
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-content
      - run: npm run check-private
      - run: npm run build
      - name: Publish production build to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch origin gh-pages
          tmpdir=$(mktemp -d)
          export GIT_INDEX_FILE="$tmpdir/index"
          git read-tree --empty
          git --work-tree="$GITHUB_WORKSPACE/dist" add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p origin/gh-pages -m "Deploy ${GITHUB_SHA}")
          git push origin "$commit:gh-pages"
