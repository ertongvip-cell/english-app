<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>私有课程管理</title><style>body{font:15px system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#17312c;background:#f4f7f3}h1{font-size:42px}section{background:white;padding:24px;border:1px solid #d9e3dd;border-radius:16px;margin:18px 0}button,label.file{display:inline-block;padding:10px 15px;border:0;border-radius:9px;background:#1f7561;color:white;cursor:pointer}input[type=file]{display:none}.row{display:grid;grid-template-columns:28px 90px 1fr 100px;gap:12px;padding:9px;border-bottom:1px solid #eee}.muted{color:#70847e}.ok{color:#187a51}.bad{color:#c9574d}</style></head><body><p class="muted">LOCAL COURSE MANAGER</p><h1>私有课程管理</h1><section><h2>1. 选择资料文件夹</h2><p>只在当前浏览器中读取文件名，不会上传。选择包含 LRC 和 MP3 的文件夹。</p><label class="file">选择文件夹<input id="folder" type="file" webkitdirectory multiple></label><p id="summary"></p></section><section><h2>2. 选择课程与起点</h2><div id="list" class="muted">请先选择文件夹</div></section><section><h2>3. 导出学习计划</h2><label>起始课程 <select id="start"></select></label> <button id="export" disabled>导出 learning-plan.json</button><p class="muted">完整课程包请使用终端中的 course-manager build 命令生成；网页用于选择课程和顺序。</p></section><script src="app.js"></script></body></html>
